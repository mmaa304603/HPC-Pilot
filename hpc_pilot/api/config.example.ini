# Local service connections always use http://127.0.0.1:<port>.
# Runtime settings: ~/.hpc-pilot/api/config.ini (or $HPC_PILOT_HOME/api/config.ini).
# Optional development config.ini files must be selected explicitly with --config.

[slurm]
port = 6820

api_version = auto

# API identity: blank selects the current Linux/Slurm account.
user =

timeout = 10

[warewulf]
port = 9873
# Warewulf API account, created by setup; independent of Linux login names.
user = hpc-pilot
timeout = 10
